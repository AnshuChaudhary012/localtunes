<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Background decorative rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1.5" />

  <!-- Ambient Glow Behind Note -->
  <circle cx="256" cy="256" r="110" fill="url(#glowGrad)" opacity="0.35" filter="url(#glow)" />

  <!-- Stylized Music Symbol with Frequency Waves -->
  <g filter="url(#glow)">
    <!-- Equalizer / Sound Wave arcs -->
    <path d="M 140 280 A 120 120 0 0 1 140 232" fill="none" stroke="url(#brandGrad)" stroke-width="12" stroke-linecap="round" />
    <path d="M 110 305 A 155 155 0 0 1 110 207" fill="none" stroke="url(#brandGrad)" stroke-width="10" stroke-linecap="round" opacity="0.6" />
    <path d="M 372 280 A 120 120 0 0 0 372 232" fill="none" stroke="url(#brandGrad)" stroke-width="12" stroke-linecap="round" />
    <path d="M 402 305 A 155 155 0 0 0 402 207" fill="none" stroke="url(#brandGrad)" stroke-width="10" stroke-linecap="round" opacity="0.6" />

    <!-- Connected Beamed Notes -->
    <!-- Left Note Head -->
    <ellipse cx="205" cy="320" rx="36" ry="26" transform="rotate(-20 205 320)" fill="url(#brandGrad)" />
    <!-- Right Note Head -->
    <ellipse cx="305" cy="285" rx="36" ry="26" transform="rotate(-20 305 285)" fill="url(#brandGrad)" />

    <!-- Left Stem -->
    <rect x="228" y="160" width="14" height="155" rx="7" fill="url(#brandGrad)" />
    <!-- Right Stem -->
    <rect x="328" y="125" width="14" height="155" rx="7" fill="url(#brandGrad)" />

    <!-- Top Connecting Beam -->
    <path d="M 228 160 L 342 125 L 342 155 L 228 190 Z" fill="url(#brandGrad)" />
    <!-- Inner Beam -->
    <path d="M 228 200 L 342 165 L 342 185 L 228 220 Z" fill="url(#brandGrad)" opacity="0.9" />

    <!-- Center Play/Pulse Accent -->
    <circle cx="256" cy="380" r="6" fill="#22d3ee" />
    <circle cx="236" cy="380" r="4" fill="#38bdf8" opacity="0.7" />
    <circle cx="276" cy="380" r="4" fill="#818cf8" opacity="0.7" />
  </g>
</svg>
